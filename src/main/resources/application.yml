spring:
  application:
    name: log-aggregator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}
      pool-name: LogAggregatorPool
      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: ${LOG_BATCH_SIZE:1000}
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true

  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8080
  shutdown: graceful

log:
  retention:
    days: ${LOG_RETENTION_DAYS:30}
  partition:
    create-ahead-days: ${LOG_PARTITION_CREATE_AHEAD_DAYS:7}
  batch:
    size: ${LOG_BATCH_SIZE:1000}
  ai:
    anomaly:
      cron: ${LOG_AI_ANOMALY_CRON:0 0 * * * ?}
      max-chunk-chars: ${LOG_AI_ANOMALY_MAX_CHUNK_CHARS:12000}

spring.ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat:
      options:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5-coder:3b}
    embedding:
      options:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  vectorstore:
    pgvector:
      initialize-schema: true
      dimensions: 768
      distance-type: COSINE_DISTANCE
      index-type: HNSW
      remove-existing-vector-store-table: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

app:
  security:
    user:
      username: ${APP_USERNAME}
      password: ${APP_PASSWORD}
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:600}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
