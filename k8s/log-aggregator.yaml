apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-aggregator
  template:
    metadata:
      labels:
        app: log-aggregator
    spec:
      containers:
        - name: log-aggregator
          image: log-aggregator:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: log-aggregator-secrets
                  key: db_url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: log-aggregator-secrets
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: log-aggregator-secrets
                  key: db_password
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: log-aggregator-secrets
                  key: app_username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: log-aggregator-secrets
                  key: app_password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: log-aggregator-secrets
                  key: jwt_secret
---
apiVersion: v1
kind: Service
metadata:
  name: log-aggregator
spec:
  selector:
    app: log-aggregator
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
